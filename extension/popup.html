<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Float PiP</title><link rel="stylesheet" href="style.css"><script src="player.js" defer></script><script src="popup.js" defer></script></head>
<body class="popup">
<header><img src="icons/icon48.png" width="36" height="36" alt=""><div><h1>Float PiP</h1><p class="eyebrow">A little room for your video.</p></div><span class="tag">1.0</span></header>
<main>
<div class="preview" aria-hidden="true"><div class="screen"><i></i><i></i><i></i><div class="mini"><span>▶</span></div></div><span class="orbit">↗</span></div>
<section aria-live="polite" aria-atomic="true"><h2 id="status">Finding your video…</h2><p id="detail">Checking the current tab only.</p></section>
<button id="toggle" class="primary" disabled>Open picture-in-picture</button>
<button id="refresh" class="secondary">Scan again</button>
<p class="shortcut"><kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>P</kbd> opens these controls.</p>
</main>
<footer><span class="dot"></span><span>No tracking. No account.</span><a href="help.html" target="_blank" rel="noopener">Help &amp; privacy ↗</a></footer>
</body></html>
